name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # test + coverage + browser automation deps
          pip install pytest pytest-cov coverage requests playwright pytest-playwright
          python -m playwright install --with-deps

      # ---- Unit + Integration (with coverage) ----
      - name: Run unit + integration tests (with coverage)
        run: |
          pytest --cov=app --cov-report=term-missing tests/unit tests/integration

      # ---- End-to-End (Playwright) ----
      # If your E2E uses the 'fastapi_server' fixture from tests/e2e/conftest.py,
      # this will start the app and run browser tests headlessly.
      - name: Run E2E tests (Playwright)
        run: |
          pytest -q tests/e2e

      # ---- Optional: combine coverage including E2E (only if you launched uvicorn under coverage) ----
      - name: Combine & report overall coverage (optional)
        run: |
          coverage combine || true
          coverage html || true
          coverage report -m || true

      # ---- Upload artifacts (if exist) ----
      - name: Upload Playwright report (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
            playwright/.playwright-cache/
          if-no-files-found: ignore

      - name: Upload coverage HTML (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: ignore
